<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" font-family="-apple-system,'Segoe UI',Helvetica,Arial,sans-serif">
  <defs>
    <linearGradient id="bg4" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a1033"/>
      <stop offset="1" stop-color="#241645"/>
    </linearGradient>
    <linearGradient id="quota" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7ee2a0"/>
      <stop offset="0.6" stop-color="#ffd28a"/>
      <stop offset="1" stop-color="#ff7b6b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg4)"/>

  <text x="70" y="105" fill="#ffffff" font-size="52" font-weight="800">See the limit coming.</text>
  <text x="70" y="152" fill="#b9a7e8" font-size="26">Plan quotas, live budget and burn-rate — in your statusline, on every turn.</text>

  <!-- mock statusline: riga plain (default dalla 1.39) — parole, colore solo dove qualcosa devia -->
  <rect x="70" y="215" width="1060" height="130" rx="18" fill="#0d1117" stroke="#3d2b73" stroke-width="2"/>
  <g font-family="ui-monospace,Menlo,monospace" font-size="23">
    <text x="100" y="266"><tspan fill="#9198a1">Fable 5.1 · </tspan><tspan fill="#ffd28a" font-weight="700">quota 71%, resets 17:30</tspan><tspan fill="#9198a1"> · </tspan><tspan fill="#e6edf3">context 26%</tspan><tspan fill="#9198a1"> · 2 agents working</tspan></text>
    <text x="100" y="316"><tspan fill="#5b4a8a">└ </tspan><tspan fill="#ffd28a">weekly quota 72% used, resets Thu 11</tspan></text>
  </g>

  <!-- barra quota grande -->
  <text x="70" y="435" fill="#d9c9ff" font-size="24" font-weight="700">your weekly quota</text>
  <rect x="70" y="455" width="1060" height="34" rx="17" fill="#2f2159"/>
  <rect x="70" y="455" width="740" height="34" rx="17" fill="url(#quota)"/>
  <!-- indicatore: cerchio con bordo, "tu sei qui" -->
  <circle cx="810" cy="472" r="24" fill="#ffffff"/>
  <circle cx="810" cy="472" r="10" fill="#241645"/>
  <text x="852" y="481" fill="#ffd28a" font-size="24" font-weight="700">you are HERE — warned early</text>

  <text x="70" y="560" fill="#ffffff" font-size="28" font-weight="700">The rate limit stops being a surprise —</text>
  <text x="70" y="595" fill="#9db7f5" font-size="28">it becomes a dashboard you glance at.</text>
</svg>
